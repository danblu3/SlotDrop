<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'">
<title>SlotDrop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="titlebar">
  <div class="brand"><span class="brand-mark"></span><span>SlotDrop</span><span class="tagline">Pick it in RomM. Play it on Slot. Label included.</span></div>
  <div class="win-buttons">
    <button id="win-min" title="Minimise" aria-label="Minimise"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
    <button id="win-max" title="Maximise" aria-label="Maximise"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg></button>
    <button id="win-close" class="close" title="Close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
  </div>
</header>
<main id="app"></main>
<div id="toasts" aria-live="polite"></div>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
